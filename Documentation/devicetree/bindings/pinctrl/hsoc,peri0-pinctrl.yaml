%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/hsoc,peri0-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HSOC PERI Pin Controller

maintainers:
  - Chanho Park <parkch98@gmail.com>

description:
  The HSOC PERI controllers provide pin multiplexing, drive strength and slew
  configuration, GPIO access, and one aggregated interrupt per GPIO bank.
  The number and width of banks are described by the GPIO child nodes.
  GPIO range pin offsets are cumulative across the actual hsoc,npins bank
  widths. Pinmux values retain the hardware bank stride and encode a pin as
  bank times eight plus its offset within that bank.

properties:
  compatible:
    enum:
      - hsoc,peri0-pinctrl
      - hsoc,peri1-pinctrl

  reg:
    maxItems: 1

  interrupts:
    minItems: 8
    maxItems: 14

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

patternProperties:
  '^gpio@[0-9a-d]+$':
    type: object
    additionalProperties: false
    properties:
      reg:
        minimum: 0
        maximum: 13

      hsoc,npins:
        minimum: 1
        maximum: 8

      gpio-controller: true

      '#gpio-cells':
        const: 2

      interrupt-controller: true

      '#interrupt-cells':
        const: 2

      gpio-ranges:
        maxItems: 1

      gpio-line-names:
        minItems: 1
        maxItems: 8

    required:
      - reg
      - hsoc,npins
      - gpio-controller
      - '#gpio-cells'
      - interrupt-controller
      - '#interrupt-cells'
      - gpio-ranges

  '-pins$':
    type: object
    $ref: pinmux-node.yaml#
    unevaluatedProperties: false
    properties:
      pinmux:
        minItems: 1

      drive-strength:
        enum: [2, 4, 8, 12, 16]

      slew-rate:
        enum: [0, 1]

    required:
      - pinmux

allOf:
  - $ref: pinctrl.yaml#
  - if:
      properties:
        compatible:
          const: hsoc,peri0-pinctrl
    then:
      properties:
        interrupts:
          minItems: 14
          maxItems: 14
    else:
      properties:
        interrupts:
          minItems: 8
          maxItems: 8

required:
  - compatible
  - reg
  - interrupts
  - '#address-cells'
  - '#size-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/pinctrl/hsoc.h>

    pinctrl_peri0: pinctrl@301e0000 {
        compatible = "hsoc,peri0-pinctrl";
        reg = <0x301e0000 0x10000>;
        interrupts = <GIC_SPI 334 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 335 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 336 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 337 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 338 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 339 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 340 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 341 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 342 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 343 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 344 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 345 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 346 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 347 IRQ_TYPE_LEVEL_HIGH>;
        #address-cells = <1>;
        #size-cells = <0>;

        gpio@0 {
            reg = <0>;
            hsoc,npins = <8>;
            gpio-controller;
            #gpio-cells = <2>;
            interrupt-controller;
            #interrupt-cells = <2>;
            gpio-ranges = <&pinctrl_peri0 0 0 8>;
        };

        i2c0-pins {
            pinmux = <HSOC_PINMUX(0, 0, 2)>,
                     <HSOC_PINMUX(0, 1, 2)>;
            drive-strength = <4>;
            slew-rate = <0>;
        };
    };
