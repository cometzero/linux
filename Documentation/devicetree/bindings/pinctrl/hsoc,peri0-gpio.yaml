%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/hsoc,peri0-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HSOC PERI GPIO and Pin Controller

maintainers:
  - Chanho Park <parkch98@gmail.com>

description:
  The HSOC PERI controllers provide pin multiplexing, pin configuration,
  GPIO access, and one aggregated interrupt per GPIO bank. The hardware does
  not expose its bank topology, so every bank and its width are described by
  GPIO child nodes. GPIO range pin offsets are cumulative across the actual
  hsoc,npins bank widths. Pinmux values retain the hardware bank stride and
  encode a pin as bank times eight plus its offset within that bank.

properties:
  compatible:
    enum:
      - hsoc,peri0-gpio
      - hsoc,peri1-gpio

  reg:
    maxItems: 1

  interrupts:
    minItems: 8
    maxItems: 14

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

patternProperties:
  '^gpio@[0-9a-d]+$':
    type: object
    additionalProperties: false
    properties:
      reg:
        minimum: 0
        maximum: 13

      hsoc,npins:
        $ref: /schemas/types.yaml#/definitions/uint32
        minimum: 1
        maximum: 8

      gpio-controller: true

      '#gpio-cells':
        const: 2

      interrupt-controller: true

      '#interrupt-cells':
        const: 2

      gpio-ranges:
        maxItems: 1

      gpio-line-names:
        minItems: 1
        maxItems: 8

    required:
      - reg
      - hsoc,npins
      - gpio-controller
      - '#gpio-cells'
      - interrupt-controller
      - '#interrupt-cells'
      - gpio-ranges

  '-pins$':
    type: object
    allOf:
      - $ref: pinmux-node.yaml#
      - $ref: pincfg-node.yaml#
    properties:
      pinmux:
        minItems: 1

      bias-disable: true
      bias-pull-down: true
      bias-pull-up: true
      drive-push-pull: true
      input-disable: true
      input-enable: true
      input-schmitt-disable: true
      input-schmitt-enable: true

      drive-strength: false
      slew-rate: false

      hsoc,drive-strength:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Drive strength selector, from 1x through 4x.
        minimum: 0
        maximum: 3

      hsoc,interrupt-filter-type:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Select logic-delay (0) or time-delay (1) filtering.
        enum: [0, 1]

      hsoc,interrupt-filter-depth:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Filter depth, where zero disables filtering.
        minimum: 0
        maximum: 15

    required:
      - pinmux

    additionalProperties: false

allOf:
  - $ref: pinctrl.yaml#
  - if:
      properties:
        compatible:
          const: hsoc,peri0-gpio
    then:
      properties:
        interrupts:
          minItems: 14
          maxItems: 14
    else:
      properties:
        interrupts:
          minItems: 8
          maxItems: 8

required:
  - compatible
  - reg
  - interrupts
  - '#address-cells'
  - '#size-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/pinctrl/hsoc.h>

    pinctrl_peri0: gpio@301e0000 {
        compatible = "hsoc,peri0-gpio";
        reg = <0x301e0000 0x10000>;
        interrupts = <GIC_SPI 334 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 335 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 336 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 337 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 338 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 339 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 340 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 341 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 342 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 343 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 344 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 345 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 346 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 347 IRQ_TYPE_LEVEL_HIGH>;
        #address-cells = <1>;
        #size-cells = <0>;

        gpio@0 {
            reg = <0>;
            hsoc,npins = <8>;
            gpio-controller;
            #gpio-cells = <2>;
            interrupt-controller;
            #interrupt-cells = <2>;
            gpio-ranges = <&pinctrl_peri0 0 0 8>;
        };

        i2c0-pins {
            pinmux = <HSOC_PINMUX(0, 0, 2)>,
                     <HSOC_PINMUX(0, 1, 2)>;
            hsoc,drive-strength = <1>;
            input-enable;
        };
    };
