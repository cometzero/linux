%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/qbox,pcie-epc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: QBox virtual PCIe endpoint controller

maintainers:
  - Chanho Park <parkch98@gmail.com>

properties:
  compatible:
    const: qbox,pcie-epc

  reg:
    items:
      - description: EPC control registers
      - description: Outbound PCI address translation aperture

  reg-names:
    items:
      - const: ctrl
      - const: mem

required:
  - compatible
  - reg
  - reg-names

additionalProperties: false

examples:
  - |
    pcie-epc@30300000 {
        compatible = "qbox,pcie-epc";
        reg = <0x30300000 0x1000>,
              <0x30400000 0x400000>;
        reg-names = "ctrl", "mem";
    };
